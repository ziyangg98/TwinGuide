[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-guide"
version = "0.3.0"
description = "基于三维模型的双导管牙科导板自动构建工具"
requires-python = ">=3.13,<3.15"
dependencies = [
    "manifold3d>=3.5,<4",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "PyYAML>=6.0,<7",
    "scikit-image>=0.25,<1",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
    "trimesh>=4.6,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4,<5",
    "sphinx>=8,<9",
    "sphinxcontrib-mermaid>=1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "N", "ERA", "UP", "C4", "RUF", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"src/twin_guide/tooth_mapping/contact_chords.py" = ["B023"]
"src/twin_guide/tooth_mapping/extract_contact_chord_contours.py" = ["ANN"]
"src/twin_guide/tooth_mapping/render_enhanced_crown_projection.py" = ["ANN"]
