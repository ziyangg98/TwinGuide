[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-guide"
version = "0.2.0"
description = "基于三维模型的双导套牙科导板自动构建工具"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.optional-dependencies]
docs = ["sphinx>=9,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "N", "ERA", "UP", "C4", "RUF", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
