schema_version: "1.0"

case:
  id: example_case
  display_name: Synthetic TwinGuide example
  cohort: example

objects:
  dental: {path: input/patient-dentition.stl}
  guide: {path: input/dental-guide.stl}

runtime:
  tooth_identification:
    backend: fdi_new  # 兼容回退：standard
  sleeve:
    inner_diameter_mm: 2.05
    outer_diameter_mm: 5.10
    top_recess_diameter_mm: 2.61
    top_recess_depth_mm: 0.30
    height_mm: 15.50
    platform_slot_width_mm: 1.60
    platform_overhang_mm: 0.20
    platform_height_mm: 10.00
    closed_bore_height_mm: 4.90
    inner_arc_angle_degrees: 257.83
    outer_arc_angle_degrees: 246.59
    guide_spacing_mm: 11.50  # 全局平台端面净距；所有种植位共用
  geometry:
    channel_axial_margin_mm: 5.0
    connector_diameter_mm: 4.6
    fusion_voxel_size_mm: 0.2
    connector_dental_clearance_mm: 0.2
    sleeve_stop_clearance_mm: 2.0
    sleeve_stop_front_avoidance_mm: 4.0
    connection_blocks:
      lower_main: true
      upper_main: true
      press_beam: true
    connector_guide_endpoint:
      root_radius_factor: 1.08
      transition_length_mm: 3.0
      bulb_radius_factor: 1.08
      bulb_forward_offset_mm: 0.08
      foot_major_radius_mm: 3.0
      foot_minor_radius_mm: 2.2
      foot_peak_height_mm: 2.55
      foot_embed_depth_mm: 0.25
  windows:
    operation_tangent_margin_mm: 1.0
    operation_bitangent_margin_mm: 3.0
    operation_axial_margin_mm: 5.0
    operation_front_axial_margin_mm: 5.0
    operation_rear_axial_margin_mm: 5.0
    operation_corner_radius_mm: 1.0
    observation_axis_drop_mm: 0.2
    observation_sweep_angle_degrees: 90.0
    # 确定性约束求解失败时才启用局部 0.5/1.0/2.0 mm 下沉 fallback。
    observation_adaptive_fallback_enabled: false
  press_beam:
    diameter_mm: 4.6
    guide_overlap_mm: 0.3
    junction_sleeve_distance_mm: 6.0
    junction_axial_lift_mm: 2.0
    minimum_junction_angle_degrees: 25.0
  render: {width_px: 1600, height_px: 1200}

anatomy:
  jaw: maxillary
  present_teeth: [17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27]
  missing_teeth: []
  excluded_teeth: [18, 28]
  review_status: unreviewed

design:
  observation_windows:
    - {id: window_1, fdi: [14, 15], extent_mode: center_to_center,
       axis_drop_mm: 0.5, sweep_angle_deg: 90.0}
  guide_anchors:
    mode: tooth_section_trajectory
    # mode: nearest
    # mode: adjacent_two_implant_continuous_paths
    # mode: terminal_distal_common_node
    # mode: adjacent_two_implant_terminal_distal_node_paths
    anchors:
      - {endpoint: station_1, side: u_side, fdi: 14, angle: 70.0}
      - {endpoint: station_1, side: back_u_side, fdi: 14, angle: 90.0}
      - {endpoint: station_2, side: u_side, fdi: [15, 16], angle: 70.0}
      - {endpoint: station_2, side: back_u_side, fdi: [15, 16], angle: 90.0}
  press_beam:
    mode: disabled
    # mode: inner_sleeve_upper_y
    # mode: three_tooth_anchors_y
    # mode: terminal_u_extension_anchor_y
    anchors: []

planning:
  # 每个已识别圆环分别输入钻针长度和植体长度；钻针位于手机内部的长度固定为 12 mm。
  guide_posts:
    - ring_index: 1
      drill_length_mm: 33.00
      implant_length_mm: 12.00
      sleeve_template_extension_mm: 8.00
      # sleeve 仅允许覆盖三项轴向高度；左右两根同步使用。
      sleeve:
        height_mm: 16.00
        platform_height_mm: 10.50
        closed_bore_height_mm: 5.00
  # 坐标格式、延长量定义和高度公式由医生确认后再启用。
  # clinical_parameters:
  #   implant_coordinates_path: input/implant-coordinates.dat
  #   implant_coordinates_format: vendor-format-v1
  #   extension_mm: 1.0
  #   extension_definition: clinician-confirmed-axis-extension
  #   mouth_opening_mm: 36.0
  #   adapter_length_mm: 12.0
  #   height_formula_id: clinician-formula-v1

review:
  object_mapping_status: unreviewed
